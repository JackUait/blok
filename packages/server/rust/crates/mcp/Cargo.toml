[package]
name = "blok-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Blok's MCP server: lets MCP clients read and edit Blok documents."
publish = true

[lib]
name = "blok_mcp"
path = "src/lib.rs"

[[bin]]
name = "blok-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
blok-blokagent.workspace = true
blok-blokserver-ticket.workspace = true
blok-collab-convert.workspace = true
blok-collab-docendpoint.workspace = true
blok-collab-wire.workspace = true
blok-lib0.workspace = true
blok-dotnet.workspace = true
blok-jsjson.workspace = true
blok-http.workspace = true
blok-jsruntime.workspace = true
blok-yjs.workspace = true
blok-outbound.workspace = true
bytes = "1"
flate2 = "1"
http = "1"
http-body-util = { version = "0.1", features = ["channel"] }
ring = "0.17"
serde = "1"
# Pinned: rmcp ships a minor release about every week, and the MCP
# conformance suite is what proves a bump. Client and auth features stay off:
# they pull reqwest, which dials outside the outbound law.
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io", "elicitation", "transport-streamable-http-server"] }
# preserve_order: rmcp holds tool schemas as serde_json maps, and the default
# BTreeMap re-sorts their keys. raw_value: documents pass through untouched.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util", "io-std", "fs"] }

[dev-dependencies]
blok-blokserver = { path = "../blokserver" }
blok-collab = { path = "../collab" }
blok-collab-journal = { path = "../collab-journal" }
blok-collab-room = { path = "../collab-room" }
blok-collab-workingset = { path = "../collab-workingset" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }

[lints]
workspace = true
