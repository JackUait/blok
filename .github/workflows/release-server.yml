name: Release server

on:
  push:
    tags: ['v*']

concurrency:
  group: release-server
  cancel-in-progress: false

jobs:
  # YDotNet.Native.Linux 0.6.0 mispacks its musl natives (upstream bug in
  # native/YDotNet.Native.Linux/YDotNet.Native.Linux.csproj, still on main):
  # the aarch64 musl lib is packed into runtimes/linux-musl-x64/native (wrong
  # architecture), the x64 musl build lands in runtimes/linux-x64-musl (an
  # invalid RID .NET never matches) and is glibc-linked anyway, and
  # linux-musl-arm64 has no asset at all (the RID graph silently substitutes
  # the glibc arm64 lib). So this job compiles yffi ourselves and
  # Blok.Server.Host swaps the packaged libyrs.so for exactly those two RIDs.
  # The yrs pin must match the tag YDotNet builds its own natives from: on
  # EVERY YDotNet version bump, re-read y-crdt/ydotnet's build-binaries.yml
  # and move the release-v0.19.1 pin here and in server-release-wiring.
  build-musl-yffi:
    name: Build musl libyrs (${{ matrix.rid }})
    if: github.repository == 'JackUait/blok'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      YRS_PIN: release-v0.19.1
    strategy:
      matrix:
        include:
          - rid: linux-musl-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            machine: x86-64
            loader: libc.musl-x86_64.so.1
          - rid: linux-musl-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            machine: ARM aarch64
            loader: libc.musl-aarch64.so.1
    steps:
      # No restore-keys: a lib restored from another pin must never be reused.
      - name: Restore the cached libyrs build
        id: libyrs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: yffi-out
          key: libyrs-${{ matrix.target }}-${{ env.YRS_PIN }}

      # -crt-static off is what makes the build a shared musl-linked .so;
      # rust:alpine's default toolchain already targets the musl triple.
      - name: Build yffi in a rust:alpine container
        if: steps.libyrs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p yffi-out
          docker run --rm --env YRS_PIN --volume "$PWD/yffi-out:/out" rust:alpine sh -euc '
            apk add --no-cache build-base git musl-dev
            git clone --depth 1 --branch "$YRS_PIN" https://github.com/y-crdt/y-crdt.git /src
            cd /src
            export RUSTFLAGS="-C target-feature=-crt-static"
            cargo build --release -p yffi --target ${{ matrix.target }}
            cp "target/${{ matrix.target }}/release/libyrs.so" /out/libyrs.so
          '

      # The exact failure this whole job exists to prevent is a wrong-arch or
      # glibc-linked lib in a musl RID folder, so prove both properties.
      - name: Verify the library is ${{ matrix.machine }} and musl-linked
        run: |
          file yffi-out/libyrs.so
          file yffi-out/libyrs.so | grep -F 'ELF 64-bit LSB shared object'
          file yffi-out/libyrs.so | grep -F '${{ matrix.machine }}'
          readelf -d yffi-out/libyrs.so | grep -F '${{ matrix.loader }}'

      - name: Upload the override native
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libyrs-${{ matrix.rid }}
          path: yffi-out/libyrs.so
          if-no-files-found: error

  release-server:
    name: Release server
    if: github.repository == 'JackUait/blok'
    needs: build-musl-yffi
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          install-docs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "BLOK_SERVER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Wait for successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 360); do
            state="$(gh run list --workflow CI --branch main --event push --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion \
              --jq 'if length == 0 then "missing" else "\(.[0].status):\(.[0].conclusion // "")" end')"
            case "$state" in
              completed:success)
                exit 0
                ;;
              completed:*)
                echo "::error::CI did not pass for $GITHUB_SHA ($state)"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::CI did not complete for $GITHUB_SHA after 60 minutes"
          exit 1

      - name: Wait for the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::no draft GitHub release for $GITHUB_REF_NAME after 10 minutes"
          exit 1

      - name: Test and format C# server
        run: |
          dotnet test packages/server/dotnet/Blok.Server.slnx --configuration Release
          dotnet format packages/server/dotnet/Blok.Server.slnx --verify-no-changes
          yarn test test/unit/server-conformance/server-contract.test.ts test/unit/server-conformance/sync-contract.test.ts

      - name: Fetch the musl libyrs overrides
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: libyrs-linux-musl-*
          path: .libyrs-overrides

      - name: Stage the musl libyrs overrides
        run: |
          for rid in linux-musl-x64 linux-musl-arm64; do
            install -D ".libyrs-overrides/libyrs-$rid/libyrs.so" \
              "packages/server/dotnet/Blok.Server.Host/runtimes/$rid/native/libyrs.so"
          done

      - name: Build NuGet and host artifacts
        run: |
          rm -rf .server-release-dist
          mkdir -p .server-release-dist/nuget
          dotnet pack packages/server/dotnet/Blok.Server/Blok.Server.csproj \
            --configuration Release \
            -p:PackageVersion="$BLOK_SERVER_VERSION" \
            -p:ContinuousIntegrationBuild=true \
            --output .server-release-dist/nuget
          dotnet pack packages/server/dotnet/Blok.Server.AspNetCore/Blok.Server.AspNetCore.csproj \
            --configuration Release \
            -p:PackageVersion="$BLOK_SERVER_VERSION" \
            -p:ContinuousIntegrationBuild=true \
            --output .server-release-dist/nuget
          node scripts/test-server-packages.mjs --package-dir .server-release-dist/nuget --version "$BLOK_SERVER_VERSION"
          node scripts/publish-server.mjs --version "$BLOK_SERVER_VERSION" --output .server-release-dist

      - name: Smoke runner-native archive
        run: |
          mkdir -p .server-release-smoke
          tar -xzf .server-release-dist/blok-server_linux_amd64.tar.gz -C .server-release-smoke
          .server-release-smoke/blok-server --help

      # Startup extracts the bundled natives, and musl ldd IS the dynamic
      # loader, so listing the extracted libyrs.so actually loads it — a
      # wrong-arch or glibc-linked lib fails right here instead of on the
      # first collab call on a user's Alpine box.
      - name: Smoke musl-amd64 archive on Alpine
        run: |
          mkdir -p .server-release-smoke/musl
          tar -xzf .server-release-dist/blok-server_linux_musl_amd64.tar.gz -C .server-release-smoke/musl
          docker run --rm --platform linux/amd64 \
            --volume "$PWD/.server-release-smoke/musl:/smoke:ro" \
            mcr.microsoft.com/dotnet/runtime-deps:10.0-alpine sh -euc '
              export DOTNET_BUNDLE_EXTRACT_BASE_DIR=/tmp/blok-extract
              /smoke/blok-server --help >/dev/null
              so="$(find /tmp/blok-extract -type f -name libyrs.so | head -n 1)"
              test -n "$so"
              /lib/ld-musl-x86_64.so.1 --list "$so"
            '

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push .server-release-dist/nuget/Blok.Server."$BLOK_SERVER_VERSION".nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push .server-release-dist/nuget/Blok.Server.AspNetCore."$BLOK_SERVER_VERSION".nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            .server-release-dist/blok-server_darwin_amd64.tar.gz \
            .server-release-dist/blok-server_darwin_arm64.tar.gz \
            .server-release-dist/blok-server_linux_amd64.tar.gz \
            .server-release-dist/blok-server_linux_arm64.tar.gz \
            .server-release-dist/blok-server_linux_musl_amd64.tar.gz \
            .server-release-dist/blok-server_linux_musl_arm64.tar.gz \
            .server-release-dist/blok-server_windows_amd64.zip \
            .server-release-dist/blok-server_windows_arm64.zip \
            .server-release-dist/checksums.txt \
            .server-release-dist/nuget/Blok.Server."$BLOK_SERVER_VERSION".nupkg \
            .server-release-dist/nuget/Blok.Server.AspNetCore."$BLOK_SERVER_VERSION".nupkg \
            --clobber

      - name: Build and smoke linux/amd64 image
        run: |
          image="ghcr.io/jackuait/blok-server"
          image_tags=(--tag "$image:$BLOK_SERVER_VERSION")
          if [[ "$BLOK_SERVER_VERSION" != *-* ]]; then
            image_tags+=(--tag "$image:latest")
          fi
          docker build --platform linux/amd64 -f packages/server/Dockerfile \
            --build-arg BLOK_SERVER_VERSION="$BLOK_SERVER_VERSION" \
            "${image_tags[@]}" \
            .

          unsafe_log="$(mktemp)"
          set +e
          timeout 10s docker run --rm "$image:$BLOK_SERVER_VERSION" \
            --listen 0.0.0.0:4000 --auth none >"$unsafe_log" 2>&1
          unsafe_status=$?
          set -e

          if [ "$unsafe_status" -eq 124 ]; then
            echo "::error::unsafe configuration smoke timed out"
            cat "$unsafe_log"
            exit 1
          fi
          if [ "$unsafe_status" -eq 0 ]; then
            echo "::error::public unauthenticated configuration started"
            exit 1
          fi
          unsafe_refusal="$(cat "$unsafe_log")"
          rm -f "$unsafe_log"
          expected_refusal='blok-server refused to start: --auth none serves anyone who can reach "0.0.0.0:4000" (which binds every network interface); it may only bind loopback — use --listen 127.0.0.1:PORT, or --auth ticket to expose this service'
          if [ "$unsafe_refusal" != "$expected_refusal" ]; then
            echo "::error::unsafe configuration failed for an unexpected reason"
            printf '%s\n' "$unsafe_refusal"
            exit 1
          fi

          docker run --detach --rm --name blok-server-release-smoke \
            --network host \
            "$image:$BLOK_SERVER_VERSION" \
            --listen 127.0.0.1:4000 \
            --auth proxy \
            --storage-dir ''
          trap 'docker rm -f blok-server-release-smoke >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          test "$(curl --fail --silent http://127.0.0.1:4000/health)" = \
            "{\"status\":\"ok\",\"version\":\"$BLOK_SERVER_VERSION\"}"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:4000/unfurl)" = "400"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:4000/upload)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:4000/missing)" = "404"

      # The spike proved single-file extraction as root only; this proves it
      # for the image's real user 65532 with no writable home (default
      # /var/tmp base). If it ever fails, set DOTNET_BUNDLE_EXTRACT_BASE_DIR
      # in the Dockerfile — do not give the user a home directory.
      - name: Smoke image native extraction as USER 65532
        run: |
          image="ghcr.io/jackuait/blok-server"
          docker run --rm --entrypoint /bin/sh "$image:$BLOK_SERVER_VERSION" -euc '
            test "$(id -u)" = "65532"
            test ! -w "${HOME:-/}"
            /blok-server --help >/dev/null
            so="$(find /var/tmp /tmp -type f -name libyrs.so 2>/dev/null | head -n 1)"
            test -n "$so"
            ldd "$so"
          '

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-architecture image
        run: |
          image="ghcr.io/jackuait/blok-server"
          image_tags=(--tag "$image:$BLOK_SERVER_VERSION")
          if [[ "$BLOK_SERVER_VERSION" != *-* ]]; then
            image_tags+=(--tag "$image:latest")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f packages/server/Dockerfile \
            --build-arg BLOK_SERVER_VERSION="$BLOK_SERVER_VERSION" \
            "${image_tags[@]}" \
            --push \
            .

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

      - name: Verify published server delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_path="${BLOK_SERVER_VERSION,,}"
          required_assets=(
            blok-server_darwin_amd64.tar.gz
            blok-server_darwin_arm64.tar.gz
            blok-server_linux_amd64.tar.gz
            blok-server_linux_arm64.tar.gz
            blok-server_linux_musl_amd64.tar.gz
            blok-server_linux_musl_arm64.tar.gz
            blok-server_windows_amd64.zip
            blok-server_windows_arm64.zip
            checksums.txt
            "Blok.Server.$BLOK_SERVER_VERSION.nupkg"
            "Blok.Server.AspNetCore.$BLOK_SERVER_VERSION.nupkg"
          )
          anonymous_docker_config="$(mktemp -d)"

          for _ in $(seq 1 60); do
            ready=true
            for package in blok.server blok.server.aspnetcore; do
              curl --fail --silent \
                "https://api.nuget.org/v3-flatcontainer/$package/$version_path/$package.$version_path.nupkg" \
                >/dev/null || ready=false
            done

            assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')" || ready=false
            for asset in "${required_assets[@]}"; do
              grep --fixed-strings --line-regexp --quiet "$asset" <<<"$assets" || ready=false
            done

            manifest=''
            if ! manifest="$(DOCKER_CONFIG="$anonymous_docker_config" docker manifest inspect \
              "ghcr.io/jackuait/blok-server:$BLOK_SERVER_VERSION" 2>/dev/null)"; then
              ready=false
            fi
            grep --quiet '"architecture": "amd64"' <<<"$manifest" || ready=false
            grep --quiet '"architecture": "arm64"' <<<"$manifest" || ready=false

            if [ "$ready" = "true" ]; then
              exit 0
            fi
            sleep 10
          done

          echo "::error::server delivery is not fully observable after 10 minutes"
          exit 1

      - name: Publish the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Deploy docs from the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-docs.yml \
            --ref "$GITHUB_REF_NAME" \
            -f release_tag="$GITHUB_REF_NAME"
