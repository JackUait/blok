[package]
name = "blok-outbound"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
blok-dotnet = { path = "../dotnet" }
blok-jsjson = { path = "../jsjson" }
blok-mediatype = { path = "../mediatype" }
brotli = "8"
flate2 = "1"
ring = "0.17"
sha1 = "0.10"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(not(windows))'.dependencies]
gethostname = "=1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rustls-native-certs = "0.8"

[dev-dependencies]
# The test reads the host name itself, on every target.
gethostname = "=1.1.0"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "sync", "macros"] }

[lints]
workspace = true
