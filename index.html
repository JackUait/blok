  <script type="module">
    import './src/playground/playground.css';
    import DEFAULT_BLOCKS from './playground-document.json';
    import { Blok } from './src/blok.ts';
    import { blocksToHtml } from './src/view/index.ts';
    // Raw text of the published opt-in view stylesheet. We scope it under
    // #blokview-panel before injecting, because the live editor ALSO stamps
    // `data-blok-tool` on its blocks — an unscoped import would double-style the
    // editor. Scoping keeps the sheet affecting only the Blok View render.
    import viewCssText from './view.css?raw';
    import { Paragraph, Header, List, Table, Toggle, Callout, Database, DatabaseRow, Divider, Spacer, Quote, Code, Image, File as FileBlock, Video, Audio, ColumnList, Column, Embed, Bookmark, Page, Bold, Italic, Link, Marker, Underline, Strikethrough, InlineCode, Equation, ClearFormat, SupSub } from './src/tools/index.ts';
    import * as Icons from './src/components/icons/index.ts';
    import { ALL_LOCALE_CODES, getDirection } from './src/components/i18n/locales/index.ts';
    import { renderIconGallery } from './src/playground/icon-gallery.ts';
    import { renderRadiusGallery } from './src/playground/radius-gallery.ts';
    import { renderPreviewGallery } from './src/playground/preview-gallery.ts';
    import enMessagesModule from './src/components/i18n/locales/en.json';
    import * as BuiltInTools from './src/tools/index.ts';
    import { slowImageRetries } from './src/playground/slow-image-retry.ts';
    import { BRAND_MARK_SLUGS, brandMarkSvg } from './src/components/utils/brand-marks.ts';
    const BRAND_MARK_GROUP = 'Brand marks';
    const BRAND_MARK_ICONS = Object.fromEntries(BRAND_MARK_SLUGS.map((slug) => [slug, brandMarkSvg(slug)]));
    import { PRESENCE_GLYPH_GROUP, PRESENCE_GLYPH_ICONS } from './src/playground/presence-glyph-icons.ts';
    import { buildPresenceFace } from './src/playground/presence-face.ts';
    import { renderBlockStatesGallery } from './src/playground/block-states-gallery.ts';
    import { PAGE_HEADER_MORPH, PAGE_TITLE_SELECTOR, PageRegistry, caretToFirstBlock, firstBlockKeydown, replaceTitleText, PointerWatch, alignPageHeader, hasPointer, pointerBlock, keepPageHeaderAligned, SEED_PAGES, pageIdFromPath, pageLinkMorph, pagePath, renderPageHeader, runPageTransition } from './src/playground/page-host.ts';
    import { applyFontScale, buildFontScaleConfig } from './src/playground/font-scale.ts';
    import { mountPageTree } from './src/playground/page-tree.ts';
    import { mountNavIndicator } from './src/playground/nav-indicator.ts';
    import { mountPositionPicker } from './src/playground/position-picker.ts';
    import { renderUploadingState as renderFileUploadingState } from './src/tools/file/uploading-state.ts';
    // Default import only — the json-as-string vite plugin rewrites JSON
    // modules to a lone default export, so named JSON imports throw on load.
    import pkg from './package.json';

    document.getElementById('pg-version').textContent = `v${pkg.version}`;
    document.getElementById('pg-header-version').textContent = `v${pkg.version}`;
    document.getElementById('settings-close').innerHTML = Icons.IconCross;
    document.documentElement.style.setProperty('--pg-select-caret', `url("data:image/svg+xml,${encodeURIComponent(Icons.IconChevronDown.replaceAll('currentColor', '#717171'))}")`);
    document.documentElement.style.setProperty('--pg-select-caret-dark', `url("data:image/svg+xml,${encodeURIComponent(Icons.IconChevronDown.replaceAll('currentColor', '#a8a8a8'))}")`);

    /**
     * Playground state - drives editor configuration
     */
    const state = {
      readOnly: false,
      blokView: false,
      darkMode: window.matchMedia('(prefers-color-scheme: dark)').matches,
      autofocus: true,
      locale: 'en',
      rtl: false,
      toolbarPosition: 'left',
      hideToolbar: false,
      notifierPosition: 'bottom-center',
      fontScale: 1,
      tools: {
        paragraph: true,
        header: true,
        list: true,
        table: true,
        toggle: true,
        callout: true,
        database: true,
        divider: true,
        spacer: true,
        quote: true,
        code: true,
        image: true,
        file: true,
        video: true,
        audio: true,
        columns: true,
        page: true,
      },
    };

    /**
     * `yarn serve` starts a sync service beside Vite and sets this flag;
     * `yarn serve --no-server` (or a machine without .NET) leaves it off and the
     * playground works on its own local document, as it always did.
     */
    const DEV_SERVER_URL = 'http://127.0.0.1:4000';

    /**
     * Collaboration config for this tab, or null to stay local.
     *
     * `?collab=off` opens the playground on its own document without stopping
     * the backend; any other `?collab=` value picks the shared document to join.
     */
    function collaborationConfig(pageId = null) {
      const params = new URLSearchParams(window.location.search);
      const shared = params.get('collab') ?? 'playground';

      if (!__BLOK_DEV_BACKEND__ || shared === 'off') {
        return null;
      }

      // Each page is its own document, so it gets its own room.
      const doc = pageId === null ? shared : `${shared}--page--${pageId}`;
      const name = params.get('name');

      return name?.trim() ? { doc, user: { name } } : { doc };
    }

    /**
     * Who the playground says is editing. Without it every block's "Last
     * edited" footer shows a date and no author, which is what the editor
     * looks like to a host that configured no identity at all.
     *
     * The id is derived from `?name=` so two tabs opened under different names
     * attribute their edits to different people.
     */
    function userConfig() {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name')?.trim();

      if (!name) {
        return { id: 'playground-user', name: 'Playground user' };
      }

      return { id: `playground-${name.toLowerCase()}`, name };
    }

    /**
     * Build Blok config from current state
     */
    function buildConfig() {
      const tools = {
        marker: Marker,
        bold: Bold,
        italic: Italic,
        underline: Underline,
        clearFormat: ClearFormat,
        link: Link,
        strikethrough: Strikethrough,
        inlineCode: InlineCode,
        equation: Equation,
        supSub: SupSub,
      };
      if (state.tools.paragraph) tools.paragraph = { class: Paragraph, preserveBlank: true };
      if (state.tools.header) tools.header = { class: Header };
      if (state.tools.list) tools.list = List;
      if (state.tools.table) tools.table = Table;
      if (state.tools.toggle) tools.toggle = { class: Toggle, inlineToolbar: true };
      if (state.tools.callout) tools.callout = { class: Callout, inlineToolbar: true };
      if (state.tools.database) {
        tools.database = Database;
        tools['database-row'] = DatabaseRow;
      }
      if (state.tools.divider) tools.divider = Divider;
      if (state.tools.spacer) tools.spacer = Spacer;
      if (state.tools.quote) tools.quote = { class: Quote, inlineToolbar: true };
      if (state.tools.code) tools.code = { class: Code, inlineToolbar: false };
      if (state.tools.image) tools.image = Image;
      if (state.tools.file) tools.file = {
        class: FileBlock,
        config: {
          uploader: {
            uploadByFile: async (file) => ({
              url: URL.createObjectURL(file),
              fileName: file.name,
              size: file.size,
              mimeType: file.type,
            }),
          },
        },
      };
      if (state.tools.video) tools.video = {
        class: Video,
        config: {
          uploader: {
            uploadByFile: async (file) => ({
              url: URL.createObjectURL(file),
              fileName: file.name,
            }),
          },
        },
      };
      if (state.tools.audio) tools.audio = {
        class: Audio,
        config: {
          uploader: {
            uploadByFile: async (file) => ({
              url: URL.createObjectURL(file),
              fileName: file.name,
            }),
          },
        },
      };
      if (state.tools.columns) {
        tools.column_list = ColumnList;
        tools.column = Column;
      }
      // Link-paste tools. Embed works standalone; Bookmark is contract-only and
      // needs a metadata backend at `endpoint` (none here → it shows ERROR state).
      tools.embed = Embed;
      tools.bookmark = { class: Bookmark, config: { endpoint: '/unfurl' } };

      // Captured now: callbacks of this editor must keep writing to ITS page
      // even after navigation has moved `currentPageId` on.
      const pageId = currentPageId;
      const pointers = new PointerWatch(pages);
      livePointers = pointers;

      if (state.tools.page) tools.page = {
        class: Page,
        config: {
          href: (id) => pagePath(id, window.location.search),
          // Deferred: the tool keeps working on its block right after `open`.
          open: (id) => setTimeout(() => goToPage(id), 0),
          resolve: (id) => pages.info(id),
          create: ({ pageId: id }) => pages.create(id, pageId),
          preview: (id) => pages.get(id)?.blocks,
        },
      };

      const collaboration = collaborationConfig(pageId);
      // ?slowLoad=<ms> holds the document back to show the boot skeleton.
      const slowLoadMs = Number(new URLSearchParams(location.search).get('slowLoad'));
      const documentSource = slowLoadMs > 0
        ? { persistence: { load: () => new Promise(r => setTimeout(() => r({ blocks: blocksFor(pageId) }), slowLoadMs)), save: async () => {} } }
        : { data: { blocks: blocksFor(pageId) } };

      return {
        readOnly: state.readOnly,
        holder: 'blok',
        tools,
        autofocus: state.autofocus,
        notifierPosition: state.notifierPosition,
        i18n: { locale: state.locale, direction: state.rtl ? 'rtl' : 'ltr' },
        toolbarPosition: state.toolbarPosition,
        hideToolbar: state.hideToolbar,
        user: userConfig(),
        // Destroying an editor clears the theme attribute on <html>, so every
        // rebuild must say which theme the page is in (setDarkMode's rule).
        theme: state.darkMode ? 'dark' : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'auto'),
        style: { contentAlign: 'center', fontSize: buildFontScaleConfig(state.fontScale) },
        // Under collaboration the document comes from the sync service, which
        // seeds it from this same file — passing `data` too would give it two owners.
        ...(collaboration === null
          ? documentSource
          : { server: DEV_SERVER_URL, collaboration }),
        onChange(api, event) {
          console.log('something changed', event);
          refreshBlokView();
          // Under collaboration the stored copy only feeds hover previews; the
          // sync service owns the document and an editor never loads it.
          schedulePersist(api, pageId, { pointers });
        },
      };
    }

    /**
     * Draws the header's presence stack from `collaboration:status`.
     *
     * Takes the EDITOR INSTANCE explicitly rather than reading the outer `blok`
     * variable: `reinitEditor` destroys and reassigns it on every tool toggle,
     * and a listener attached to the variable instead of the instance that
     * fired `isReady` would end up subscribed to whichever instance happened to
     * be current when the callback ran — not necessarily the one that resolved.
     * @param editor - the Blok instance whose presence to draw
     */
    function wireCollaborationPresence(editor) {
      const presenceStack = document.getElementById('presence-stack');

      editor.on('collaboration:status', ({ participants }) => {
        presenceStack.replaceChildren(
          ...participants
            .filter((person) => !person.self)
            .slice(0, 4)
            .map((person) => buildPresenceFace(person))
        );
      });
    }

    /**
     * Pages. `/editor` is the root playground document; `/editor/page/<id>`
     * is one page from the registry, each its own document and its own editor.
     */
    const pages = new PageRegistry(SEED_PAGES);
    // Set once the editor is up; renderHeader and storeBlocks run before that.
    let pageTree = null;
    const pageHeader = document.getElementById('page-header');
    const baseDocumentTitle = document.title;
    let currentPageId = pageIdFromPath(window.location.pathname);
    if (currentPageId !== null && !pages.has(currentPageId)) {
      currentPageId = null;
      history.replaceState(null, '', pagePath(null, window.location.search));
    }
    // The page the live editor shows. Differs from currentPageId mid-navigation.
    let editorPageId = currentPageId;
    // The live editor's PointerWatch: Trash follows the page blocks it sees.
    let livePointers = null;
    // Root edits live for the tab only, so a reload still starts pristine.
    let rootBlocks = null;
    const scrollByPage = new Map();

    function blocksFor(pageId) {
      if (pageId === null) return structuredClone(rootBlocks ?? DEFAULT_BLOCKS);
      return structuredClone(pages.get(pageId)?.blocks ?? []);
    }

    function storeBlocks(pageId, blocks) {
      if (pageId === null) rootBlocks = blocks;
      else pages.setBlocks(pageId, blocks);
      pageTree?.refresh();
    }

    /**
     * The page blocks in the live editor. Read block by block, not through
     * save(): one block that fails to save must not hide them.
     */
    function livePagePointers(api) {
      const found = [];
      for (let i = 0; i < api.blocks.getBlocksCount(); i++) {
        const block = api.blocks.getBlockByIndex(i);
        if (block?.name === 'page') found.push({ type: 'page', data: block.preservedData });
      }
      return found;
    }

    /**
     * Updates Trash from the editor's page blocks, then puts back the block of
     * every page restored from Trash. A collaborative document is written only
     * after it loaded (an onChange), never at `isReady`, when it is empty.
     */
    function syncPointers(api, pageId, pointers, { restore = true } = {}) {
      const blocks = livePagePointers(api);
      pointers?.observe(blocks);
      if (!restore || api.readOnly?.isEnabled) return;
      for (const id of pages.pendingRestores(pageId)) {
        if (!hasPointer(blocks, id)) {
          const { type, data } = pointerBlock(id, pages);
          api.blocks.insert(type, data, undefined, api.blocks.getBlocksCount(), false);
        }
        pages.restored(id);
      }
    }

    let persistTimer;
    let persistPending = false;
    function schedulePersist(api, pageId, { pointers } = {}) {
      clearTimeout(persistTimer);
      persistPending = true;
      persistTimer = setTimeout(async () => {
        persistPending = false;
        syncPointers(api, pageId, pointers);
        try {
          storeBlocks(pageId, (await api.saver.save()).blocks);
        } catch (error) {
          console.error('Saving the page failed', error);
        }
      }, 300);
    }

    /** Saves the live editor's document under the page it shows. */
    async function snapshotEditor() {
      clearTimeout(persistTimer);
      persistPending = false;
      // Leaving a page right after deleting a page block must still trash it.
      syncPointers(blok, editorPageId, livePointers, { restore: false });
      try {
        storeBlocks(editorPageId, (await blok.save()).blocks);
      } catch (error) {
        console.error('Saving the page failed', error);
      }
    }

    // A reload or close would drop the edit still waiting on the debounce.
    function flushPendingSave() {
      if (persistPending) void snapshotEditor();
    }
    window.addEventListener('pagehide', flushPendingSave);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushPendingSave();
    });

    function renderHeader() {
      renderPageHeader(pageHeader, {
        pageId: currentPageId,
        pages,
        search: window.location.search,
        readOnly: state.readOnly,
        navigate: (id) => goToPage(id),
        splitTitle: (html) => {
          blok.blocks.insert('paragraph', { text: html }, {}, 0, false);
          blok.caret.setToFirstBlock('start');
        },
        toFirstBlock: (x) => caretToFirstBlock(blok, x),
        recordTitle: (text, typing) => titleHistory?.set(text, { typing }),
        undo: () => blok.history.undo(),
        redo: () => blok.history.redo(),
        i18n: () => ({ i18n: blok.i18n, locale: state.locale }),
        changed: () => updateDocumentTitle(),
        restore: (id) => restorePage(id),
        purge: (id) => goToPage(pages.purge(id)),
      });
      updateDocumentTitle();
      alignPageHeader(pageHeader, document.getElementById('blok'));
    }
    keepPageHeaderAligned(pageHeader, document.getElementById('blok'));
    // Capture: runs before the editor's own Backspace and ArrowUp handling.
    document.getElementById('blok').addEventListener('keydown', (event) => firstBlockKeydown(event, blok), true);

    /** Takes a page out of Trash and puts its block back in its parent. */
    function restorePage(id) {
      pages.restore(id);
      const parentId = pages.get(id)?.parentId ?? null;
      // A collaborative parent gets its block when it next opens (syncPointers).
      if (collaborationConfig(parentId) === null) {
        const blocks = blocksFor(parentId);
        if (!hasPointer(blocks, id)) storeBlocks(parentId, [...blocks, pointerBlock(id, pages)]);
        pages.restored(id);
      }
      renderHeader();
    }

    /** A local document is whole at `isReady`, so its page blocks are checked right away. */
    function syncLoadedPointers(editor) {
      if (collaborationConfig(editorPageId) === null) syncPointers(editor, editorPageId, livePointers);
    }

    function updateDocumentTitle() {
      const page = currentPageId === null ? pages.root() : pages.get(currentPageId);
      document.title = page === undefined
        ? baseDocumentTitle
        : `${page.icon ? `${page.icon} ` : ''}${page.title.trim() || 'Untitled'} · ${baseDocumentTitle}`;
      // Every title and icon change lands here, typed or from a peer.
      pageTree?.refresh();
    }

    /** The open page's title in the editor's undo history. */
    let titleHistory = null;

    function wireTitleHistory(editor) {
      const tracked = editor.history.track('title', (value, { source }) => {
        pages.setTitle(currentPageId, value ?? '');
        const title = document.querySelector(PAGE_TITLE_SELECTOR);
        // A peer's change must not pull the caret out of what this user is typing.
        if (source === 'remote') {
          if (title !== null) replaceTitleText(title, value ?? '');
          updateDocumentTitle();
          return;
        }
        renderHeader();
        const fresh = document.querySelector(PAGE_TITLE_SELECTOR);
        if (fresh === null) return;
        fresh.focus();
        window.getSelection()?.selectAllChildren(fresh);
        window.getSelection()?.collapseToEnd();
      });
      const seed = () => {
        if (titleHistory !== null) return;
        titleHistory = tracked;
        const page = currentPageId === null ? pages.root() : pages.get(currentPageId);
        // A shared document may already carry the title a peer gave it.
        const shared = tracked.get();
        if (shared === undefined) {
          tracked.set(page?.title ?? '', { record: false });
        } else if (shared !== page?.title) {
          pages.setTitle(currentPageId, shared);
          renderHeader();
        }
      };
      // A shared document is whole only after its first sync; seeding earlier
      // would write this tab's saved title over the one peers already have.
      if (collaborationConfig(editorPageId) === null) {
        seed();
      } else {
        editor.on('collaboration:status', ({ status }) => {
          if (status === 'connected') seed();
        });
      }
    }

    /** Destroys the live editor and builds one for currentPageId. */
    async function swapEditor() {
      clearTimeout(persistTimer);
      persistPending = false;
      blok.destroy();
      titleHistory = null;
      const editor = new Blok(buildConfig());
      blok = editor;
      window.blok = editor;
      editorPageId = currentPageId;
      try {
        await editor.isReady;
        wireTitleHistory(editor);
        refreshBlokView();
        wireCollaborationPresence(editor);
        syncLoadedPointers(editor);
      } catch (error) {
        console.error('Editor failed to start', error);
      }
    }

    // Navigation, tool toggles and reset all rebuild the editor; one queue keeps
    // a late save from landing on the next page.
    let editorQueue = Promise.resolve();
    function queueEditorWork(work) {
      editorQueue = editorQueue.then(work).catch((error) => console.error(error));
      return editorQueue;
    }

    /**
     * Shows a page (null = root). `push: false` is for popstate, where the
     * browser already moved the URL.
     */
    function goToPage(pageId, { push = true } = {}) {
      return queueEditorWork(async () => {
        const target = pageId !== null && pages.has(pageId) ? pageId : null;

        if (push) history.pushState(null, '', pagePath(target, window.location.search));
        if (target === editorPageId) {
          currentPageId = target;
          renderHeader();
          return;
        }

        const from = editorPageId;
        // Up the tree (breadcrumbs, browser back) slides the other way.
        // A page deleted for good goes up to its parent, so it slides back too.
        const back = from !== null && (target === null || !pages.has(from) || pages.trail(from).some((page) => page.id === target));

        scrollByPage.set(from, window.scrollY);
        await snapshotEditor();
        currentPageId = target;

        await runPageTransition(async () => {
          await swapEditor();
          renderHeader();
          window.scrollTo(0, back ? (scrollByPage.get(target) ?? 0) : 0);
          // A brand-new page starts at its title, like Notion.
          if (target !== null && pages.get(target)?.title === '' && !state.readOnly) {
            document.querySelector(PAGE_TITLE_SELECTOR)?.focus();
          }
        }, {
          direction: back ? 'back' : 'forward',
          // Back morphs nothing: the row it would land on is Blok's DOM, which
          // re-renders when the page syncs, and a named element replaced
          // mid-transition makes the browser cut it short.
          from: back ? null : pageLinkMorph(target),
          to: back ? null : PAGE_HEADER_MORPH,
        });
      });
    }

    let blok = new Blok(buildConfig());
    window.blok = blok;
    blok.isReady.then(() => {
      wireTitleHistory(blok);
      wireCollaborationPresence(blok);
      syncLoadedPointers(blok);
      alignPageHeader(pageHeader, document.getElementById('blok'));
    });
    renderHeader();

    pageTree = mountPageTree({
      pages,
      blocksOf: (id) => (id === null ? (rootBlocks ?? DEFAULT_BLOCKS) : pages.get(id)?.blocks),
      currentPageId: () => currentPageId,
      href: (id) => pagePath(id, window.location.search),
      navigate: (id) => goToPage(id),
    });

    /**
     * Reinitialize editor with current state.
     * Debounced to prevent zombie instances when toggling multiple checkboxes rapidly.
     * The root document restarts from the showcase; a page keeps its content. `reset` also puts every page back to the seed.
     */
    let reinitTimeout;
    function reinitEditor({ reset = false } = {}) {
      clearTimeout(reinitTimeout);
      reinitTimeout = setTimeout(() => queueEditorWork(async () => {
        if (reset) {
          clearTimeout(persistTimer);
          persistPending = false;
          pages.reset();
          rootBlocks = null;
          if (currentPageId !== null && !pages.has(currentPageId)) {
            currentPageId = null;
            history.replaceState(null, '', pagePath(null, window.location.search));
          }
        } else if (editorPageId === null) {
          clearTimeout(persistTimer);
          persistPending = false;
          rootBlocks = null;
        } else {
          await snapshotEditor();
        }
        await swapEditor();
        renderHeader();
      }), 50);
    }

    /**
     * Page routing
     */
    const tabs = document.querySelectorAll('[role="tab"]');
    const playgroundNav = document.querySelector('.playground-nav');
    playgroundNav.querySelectorAll('[data-icon]').forEach((slot) => {
      slot.innerHTML = Icons[slot.dataset.icon];
    });
    const navIndicator = mountNavIndicator(playgroundNav);
    document.querySelector('.playground-wordmark').addEventListener('click', (event) => {
      event.preventDefault();
      playgroundNav.querySelector('[data-tab="editor"]').click();
    });

    const VALID_PAGES = ['editor', 'block-states', 'icons', 'rounding', 'previews'];

    function parseRoute(pathname) {
      const segments = pathname.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
      const page = VALID_PAGES.includes(segments[0]) ? segments[0] : 'editor';
      const subpath = segments.slice(1).join('/');
      return { page, subpath };
    }

    let blockStatesInitialized = false;
    let radiusGalleryHandle = null;
    let blockStatesHandle = null;

    function navigateTo(page, subpath) {
      tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.tab === page ? 'true' : 'false'));
      // On phones the pill scrolls; keep the active tab in view without moving the page.
      const activeTab = [...tabs].find(t => t.dataset.tab === page);
      if (activeTab && activeTab.parentElement) {
        const nav = activeTab.parentElement;
        nav.scrollLeft = activeTab.offsetLeft - (nav.clientWidth - activeTab.offsetWidth) / 2;
      }
      if (activeTab && activeTab.parentElement === playgroundNav) navIndicator.select(activeTab);
      document.getElementById('tab-editor').classList.toggle('hidden', page !== 'editor');
      pageTree.setAvailable(page === 'editor');
      document.getElementById('tab-block-states').classList.toggle('hidden', page !== 'block-states');
      document.getElementById('tab-icons').classList.toggle('hidden', page !== 'icons');
      document.getElementById('tab-rounding').classList.toggle('hidden', page !== 'rounding');
      document.getElementById('tab-previews').classList.toggle('hidden', page !== 'previews');

      if (page === 'rounding') {
        radiusGalleryHandle?.refresh();
      }

      if (page === 'block-states') {
        if (!blockStatesInitialized) {
          blockStatesInitialized = true;
          queueMicrotask(() => initBlockStatesGallery(subpath || null));
        } else if (subpath && blockStatesHandle) {
          blockStatesHandle.setActiveTool(subpath);
        }
      }
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', (e) => {
        e.preventDefault();
        const page = tab.dataset.tab;
        if (page === 'editor') {
          // The Editor tab leads home, to the root document.
          navigateTo(page, '');
          goToPage(null);
          return;
        }
        history.pushState(null, '', `/${page}${window.location.search}`);
        navigateTo(page, '');
      });
    });

    window.addEventListener('popstate', () => {
      const { page, subpath } = parseRoute(window.location.pathname);
      navigateTo(page, subpath);
      if (page === 'editor') goToPage(pageIdFromPath(window.location.pathname), { push: false });
    });

    // Initial route
    const initialRoute = parseRoute(window.location.pathname);
    const rawSlug = window.location.pathname.replace(/^\//, '').split('/')[0];
    if (!VALID_PAGES.includes(rawSlug)) {
      // Keep the query: `?collab=` and `?name=` are read again on every editor
      // rebuild, and dropping them here silently switched the mode back.
      history.replaceState(null, '', `/editor${window.location.search}`);
    }
    navigateTo(initialRoute.page, initialRoute.subpath);

    /**
     * Hide playground header + settings side-tab on scroll down, show on scroll up.
     */
    (() => {
      const header = document.querySelector('.playground-header');
      const sideTab = document.getElementById('settings-tab');
      if (!header) return;
      const HIDE_THRESHOLD = 80;
      let lastY = window.scrollY;
      let ticking = false;
      const setHidden = (hidden) => {
        header.classList.toggle('is-hidden', hidden);
        if (sideTab) sideTab.classList.toggle('is-hidden', hidden);
        document.body.classList.toggle('header-hidden', hidden);
      };
      const update = () => {
        const y = window.scrollY;
        header.classList.toggle('is-scrolled', y > 0);
        if (y <= HIDE_THRESHOLD) {
          setHidden(false);
        } else if (y > lastY) {
          setHidden(true);
        } else if (y < lastY) {
          setHidden(false);
        }
        lastY = y;
        ticking = false;
      };
      window.addEventListener('scroll', () => {
        if (!ticking) {
          ticking = true;
          window.requestAnimationFrame(update);
        }
      }, { passive: true });
    })();

    /**
     * Settings panel open/close
     */
    const settingsTab = document.getElementById('settings-tab');
    const settingsPanel = document.getElementById('settings-panel');
    const settingsClose = document.getElementById('settings-close');
    settingsPanel.querySelectorAll('[data-icon]').forEach((slot) => {
      slot.innerHTML = Icons[slot.dataset.icon];
    });
    mountPositionPicker(document.getElementById('select-notifier-position'), document.getElementById('notifier-position-picker'));

    function openSettingsPanel() {
      settingsPanel.style.transform = '';
      settingsPanel.classList.remove('translate-x-full');
      settingsTab.classList.add('hidden');
    }

    function closeSettingsPanel() {
      settingsPanel.classList.add('translate-x-full');
      settingsTab.classList.remove('hidden');
      settingsTab.classList.remove('is-hidden');
    }

    function toggleSettingsPanel() {
      if (settingsPanel.classList.contains('translate-x-full')) {
        openSettingsPanel();
      } else {
        closeSettingsPanel();
      }
    }

    settingsTab.addEventListener('click', openSettingsPanel);
    settingsPanel.addEventListener('scroll', () => {
      settingsPanel.classList.toggle('is-scrolled', settingsPanel.scrollTop > 0);
    }, { passive: true });
    settingsClose.addEventListener('click', closeSettingsPanel);

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === '\\') {
        e.preventDefault();
        toggleSettingsPanel();
        return;
      }
      if (e.key === 'Escape' && !settingsPanel.classList.contains('translate-x-full')) {
        e.preventDefault();
        closeSettingsPanel();
        return;
      }
      if (!e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;

      const settingsShortcuts = {
        KeyR: () => document.getElementById('toggle-readonly').click(),
        KeyV: () => document.getElementById('toggle-blokview').click(),
        KeyD: () => document.getElementById('toggle-dark').click(),
        KeyF: () => document.getElementById('toggle-autofocus').click(),
        KeyT: () => document.getElementById('toggle-rtl').click(),
        KeyL: () => {
          openSettingsPanel();
          document.getElementById('locale-trigger').click();
        },
        KeyN: () => {
          const sel = document.getElementById('select-notifier-position');
          const next = (sel.selectedIndex + 1) % sel.options.length;
          sel.selectedIndex = next;
          sel.dispatchEvent(new Event('change'));
        },
        KeyX: () => document.getElementById('reset-content').click(),
        KeyP: () => pageTree.toggle(),
      };

      const toolMatch = e.code.match(/^Digit([1-9])$/);
      if (toolMatch) {
        const tool = TOOL_DEFS[Number(toolMatch[1]) - 1];
        if (tool) {
          e.preventDefault();
          document.getElementById(`toggle-tool-${tool.key}`).click();
        }
        return;
      }

      const action = settingsShortcuts[e.code];
      if (action) {
        e.preventDefault();
        action();
      }
    });

    /**
     * Mode toggles
     */
    const toggleReadonly = document.getElementById('toggle-readonly');
    const toggleDark = document.getElementById('toggle-dark');
    const toggleAutofocus = document.getElementById('toggle-autofocus');
    const toggleRtl = document.getElementById('toggle-rtl');
    const toggleControlsRight = document.getElementById('toggle-controls-right');
    const toggleHideToolbar = document.getElementById('toggle-hide-toolbar');

    /**
     * Applies or removes dark mode on the page and Blok theme.
     * Single source of truth used by the manual toggle and the system
     * preference change listener.
     */
    let themeFadeTimer = null;

    function setDarkMode(enabled) {
      state.darkMode = enabled;
      toggleDark.checked = enabled;
      document.querySelectorAll('[data-theme-choice]').forEach((option) => {
        option.setAttribute('aria-pressed', String((option.dataset.themeChoice === 'dark') === enabled));
      });
      document.body.classList.toggle('dark-mode', enabled);
      if (enabled) {
        document.documentElement.setAttribute('data-blok-theme', 'dark');
      } else {
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (systemPrefersDark) {
          // System is dark but user explicitly wants light — use "light" override
          // so the @media dark rule's :not([data-blok-theme="light"]) guard fires
          document.documentElement.setAttribute('data-blok-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-blok-theme');
        }
      }
    }

    function applyDarkMode(enabled, { animate = false } = {}) {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!animate || reducedMotion) {
        setDarkMode(enabled);
        return;
      }

      if (document.startViewTransition) {
        // Snapshot old/new states and cross-fade them as single images —
        // the entire viewport switches simultaneously. Per-element
        // transitions are suppressed so the new snapshot is final-state.
        document.body.classList.add('pg-no-transition');
        const vt = document.startViewTransition(() => setDarkMode(enabled));
        vt.finished.finally(() => document.body.classList.remove('pg-no-transition'));
        return;
      }

      // Fallback: brief uniform transition on everything
      document.body.classList.add('pg-theme-fade');
      clearTimeout(themeFadeTimer);
      themeFadeTimer = setTimeout(() => {
        document.body.classList.remove('pg-theme-fade');
      }, 320);
      setDarkMode(enabled);
    }

    // Apply initial dark mode based on system preference
    applyDarkMode(state.darkMode);

    // Keep in sync when the system preference changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      applyDarkMode(e.matches, { animate: true });
    });

    toggleReadonly.addEventListener('change', async () => {
      state.readOnly = toggleReadonly.checked;
      await blok.readOnly.toggle(state.readOnly);
      renderHeader();
    });

    /**
     * Blok View — render the current document through the framework-agnostic
     * view renderer (`blocksToHtml`) next to the editor, styled with the
     * published `view.css`, so its read-only output can be compared against the
     * live editor at a glance.
     */
    const toggleBlokview = document.getElementById('toggle-blokview');
    const editorSheet = document.getElementById('editor-sheet');
    const editorColLabel = document.getElementById('editor-col-label');
    const blokviewCol = document.getElementById('blokview-col');
    const blokviewPanel = document.getElementById('blokview-panel');

    // Scope every view.css rule under #blokview-panel, then inject once. The
    // editor stamps `data-blok-tool` on its own blocks, so an unscoped sheet
    // would restyle the editor too.
    (function injectScopedViewCss() {
      const scoped = viewCssText
        .replace(/\/\*[\s\S]*?\*\//g, '')
        .replace(/([^{}]+)\{/g, (_m, sel) =>
          sel.split(',').map((s) => `#blokview-panel ${s.trim()}`).filter(Boolean).join(', ') + ' {');
      const style = document.createElement('style');
      style.id = 'blokview-scoped-css';
      style.textContent = scoped;
      document.head.appendChild(style);
    })();

    let blokViewRefreshTimer;
    async function refreshBlokView() {
      if (!state.blokView) return;
      clearTimeout(blokViewRefreshTimer);
      blokViewRefreshTimer = setTimeout(async () => {
        if (!state.blokView) return;
        try {
          const data = await blok.save();
          blokviewPanel.innerHTML = blocksToHtml(data, { toolAttributes: true });
        } catch (err) {
          console.error('Blok View render failed', err);
        }
      }, 120);
    }

    function applyBlokView(enabled) {
      state.blokView = enabled;
      toggleBlokview.checked = enabled;
      blokviewCol.classList.toggle('hidden', !enabled);
      editorSheet.classList.toggle('is-split', enabled);
      editorColLabel.hidden = !enabled;
      alignPageHeader(pageHeader, document.getElementById('blok'));
      if (enabled) refreshBlokView();
    }

    toggleBlokview.addEventListener('change', () => applyBlokView(toggleBlokview.checked));

    document.querySelectorAll('[data-theme-choice]').forEach((option) => {
      option.addEventListener('click', () => {
        // Clicking the side already on must not flip it back.
        if ((option.dataset.themeChoice === 'dark') !== toggleDark.checked) toggleDark.click();
      });
    });

    toggleDark.addEventListener('change', () => {
      applyDarkMode(toggleDark.checked, { animate: true });
    });

    toggleAutofocus.addEventListener('change', () => {
      state.autofocus = toggleAutofocus.checked;
    });

    toggleRtl.addEventListener('change', async () => {
      state.rtl = toggleRtl.checked;
      // Live update — no reinit needed, config.i18n.direction is reactive
      await blok.i18n.update({ direction: state.rtl ? 'rtl' : 'ltr' });
    });

    // Both are BlokState fields: live setters, no reinit.
    toggleControlsRight.addEventListener('change', () => {
      state.toolbarPosition = toggleControlsRight.checked ? 'right' : 'left';
      blok.toolbar.setPosition(state.toolbarPosition);
    });

    toggleHideToolbar.addEventListener('change', () => {
      state.hideToolbar = toggleHideToolbar.checked;
      blok.toolbar.setHidden(state.hideToolbar);
    });

    /**
     * Language picker — every supported locale, labelled in its own language.
     *
     * A searchable listbox rather than a native <select>: ~70 locales is more
     * than an OS dropdown can show without covering the window, and none of
     * them can be typed at.
     */
    const localeTrigger = document.getElementById('locale-trigger');
    const localeTriggerLabel = document.getElementById('locale-trigger-label');

    const LOCALES = ALL_LOCALE_CODES.map((code) => {
      let nativeName = code;
      try {
        nativeName = new Intl.DisplayNames([code], { type: 'language' }).of(code) ?? code;
      } catch {
        // Locale unknown to Intl — fall back to the raw code
      }

      return { code, name: nativeName };
    }).sort((a, b) => a.name.localeCompare(b.name));

    const localeMenu = document.createElement('div');
    localeMenu.id = 'locale-menu';
    localeMenu.hidden = true;
    localeMenu.innerHTML = `
      <div class="lang-search-wrap">
        <input id="locale-search" type="text" placeholder="Search language" aria-label="Search language" autocomplete="off" spellcheck="false">
      </div>
      <ul id="locale-list" role="listbox" aria-label="Editor language"></ul>
      <div class="lang-empty" id="locale-empty" hidden>No language matches</div>
    `;
    document.body.appendChild(localeMenu);

    const localeSearch = localeMenu.querySelector('#locale-search');
    const localeList = localeMenu.querySelector('#locale-list');
    const localeEmpty = localeMenu.querySelector('#locale-empty');

    const localeLabel = (code) => {
      const entry = LOCALES.find((locale) => locale.code === code);

      return entry ? `${entry.name} (${entry.code})` : code;
    };

    localeTriggerLabel.textContent = localeLabel(state.locale);

    /* One button per locale; the list is rebuilt on every keystroke of the filter. */
    const renderLocaleOptions = (query = '') => {
      const needle = query.trim().toLowerCase();
      const matches = LOCALES.filter(({ code, name }) =>
        needle === '' || code.includes(needle) || name.toLowerCase().includes(needle));

      localeList.replaceChildren(...matches.map(({ code, name }) => {
        const item = document.createElement('li');
        const option = document.createElement('button');

        option.type = 'button';
        option.className = 'lang-option';
        option.role = 'option';
        option.dataset.code = code;
        option.setAttribute('aria-selected', String(code === state.locale));
        option.innerHTML = `
          <span class="lang-option__check" aria-hidden="true">
            ${Icons.IconCheck}
          </span>
          <span class="lang-option__name"></span>
          <span class="lang-option__code">${code}</span>
        `;
        option.querySelector('.lang-option__name').textContent = name;
        item.appendChild(option);

        return item;
      }));

      localeEmpty.hidden = matches.length > 0;
      localeList.hidden = matches.length === 0;

      const selected = localeList.querySelector('[aria-selected="true"]');

      setActiveLocaleOption(selected ?? localeList.querySelector('.lang-option'), { scroll: false });
    };

    function setActiveLocaleOption(option, { scroll = true } = {}) {
      for (const other of localeList.querySelectorAll('[data-active="true"]')) {
        delete other.dataset.active;
      }

      if (!option) {
        localeList.removeAttribute('aria-activedescendant');

        return;
      }

      option.dataset.active = 'true';

      if (scroll) {
        // 'nearest' keeps the scroll inside the list — the page must not move
        option.scrollIntoView({ block: 'nearest' });
      }
    }

    const LOCALE_MENU_GAP = 6;
    const LOCALE_MENU_EDGE = 12;

    const positionLocaleMenu = () => {
      const rect = localeTrigger.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom - LOCALE_MENU_GAP - LOCALE_MENU_EDGE;
      const spaceAbove = rect.top - LOCALE_MENU_GAP - LOCALE_MENU_EDGE;
      // Below unless that side is cramped and the other one is roomier
      const above = spaceBelow < 220 && spaceAbove > spaceBelow;

      /*
       * The list scrolls, so the menu never has to overflow the viewport to
       * show every locale: cap it at whatever room the chosen side has.
       */
      const chrome = localeMenu.offsetHeight - localeList.offsetHeight;
      const room = (above ? spaceAbove : spaceBelow) - chrome;

      localeList.style.maxHeight = `${Math.max(120, Math.min(280, room))}px`;

      const width = localeMenu.offsetWidth;
      const height = localeMenu.offsetHeight;
      const top = above ? rect.top - height - LOCALE_MENU_GAP : rect.bottom + LOCALE_MENU_GAP;

      localeMenu.style.left = `${Math.max(LOCALE_MENU_EDGE, Math.min(rect.right - width, window.innerWidth - width - LOCALE_MENU_EDGE))}px`;
      // The cap is a best estimate; clamping is what actually keeps it on screen
      localeMenu.style.top = `${Math.max(LOCALE_MENU_EDGE, Math.min(top, window.innerHeight - height - LOCALE_MENU_EDGE))}px`;
    };

    const isLocaleMenuOpen = () => !localeMenu.hidden;

    const openLocaleMenu = () => {
      if (isLocaleMenuOpen()) return;

      localeSearch.value = '';
      renderLocaleOptions();
      localeMenu.hidden = false;
      localeTrigger.setAttribute('aria-expanded', 'true');
      positionLocaleMenu();
      localeSearch.focus();

      const selected = localeList.querySelector('[aria-selected="true"]');
      if (selected) selected.scrollIntoView({ block: 'center' });
    };

    const closeLocaleMenu = ({ restoreFocus = false } = {}) => {
      if (!isLocaleMenuOpen()) return;

      localeMenu.hidden = true;
      localeTrigger.setAttribute('aria-expanded', 'false');

      if (restoreFocus) localeTrigger.focus();
    };

    const pickLocale = async (code) => {
      closeLocaleMenu({ restoreFocus: true });

      if (code === state.locale) return;

      state.locale = code;
      localeTriggerLabel.textContent = localeLabel(code);
      // Locale implies direction; keep the RTL toggle in sync with it
      state.rtl = getDirection(code) === 'rtl';
      toggleRtl.checked = state.rtl;

      await blok.i18n.update({
        locale: code,
        direction: state.rtl ? 'rtl' : 'ltr',
      });
    };

    localeTrigger.addEventListener('click', () => {
      if (isLocaleMenuOpen()) {
        closeLocaleMenu();
      } else {
        openLocaleMenu();
      }
    });

    localeSearch.addEventListener('input', () => {
      renderLocaleOptions(localeSearch.value);
      // fewer matches means a shorter menu — re-anchor it to the trigger
      positionLocaleMenu();
    });

    localeList.addEventListener('click', (e) => {
      const option = e.target.closest('.lang-option');

      if (option) void pickLocale(option.dataset.code);
    });

    localeList.addEventListener('pointermove', (e) => {
      const option = e.target.closest('.lang-option');

      if (option && option.dataset.active !== 'true') {
        setActiveLocaleOption(option, { scroll: false });
      }
    });

    localeMenu.addEventListener('keydown', (e) => {
      const options = [...localeList.querySelectorAll('.lang-option')];
      const activeIndex = options.findIndex((option) => option.dataset.active === 'true');

      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (options.length === 0) return;
        const delta = e.key === 'ArrowDown' ? 1 : -1;
        const next = (activeIndex + delta + options.length) % options.length;
        setActiveLocaleOption(options[next]);
        return;
      }
      if (e.key === 'Home' || e.key === 'End') {
        e.preventDefault();
        setActiveLocaleOption(e.key === 'Home' ? options[0] : options[options.length - 1]);
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (options[activeIndex]) void pickLocale(options[activeIndex].dataset.code);
        return;
      }
      // Esc closes the picker only — the panel's own Esc must not also fire
      if (e.key === 'Escape' || e.key === 'Tab') {
        e.stopPropagation();
        e.preventDefault();
        closeLocaleMenu({ restoreFocus: true });
      }
    });

    function flattenStates(tool, label, states) {

      states.forEach((state, i) => {
        const header = {
          id: `${tool}-label-${i}`,

    const BLOCK_STATES_SPEC = BLOCK_STATES_RAW.map(entry => flattenStates(entry.tool, entry.label, entry.states));

    const blockStatesInstances = [];

    function mountStatePreview({ container, segments }) {
      segments.forEach((segment) => mountStateSegment(container, segment));
    }

    function mountStateSegment(container, { blocks, toolConfig = {} }) {
      const holder = document.createElement('div');
      container.appendChild(holder);
      const tools = {
          paragraph: { class: Paragraph, preserveBlank: true },
          header: Header,
          list: List,
          table: Table,
          toggle: Toggle,
          callout: Callout,
          database: Database,
          'database-row': DatabaseRow,
          divider: Divider,
          spacer: Spacer,
          quote: Quote,
          code: Code,
          image: Image,
          video: {
            class: Video,
            config: {
              uploader: {
                uploadByFile: async (file) => ({
                  url: URL.createObjectURL(file),
                  fileName: file.name,
                }),
              },
            },
          },
          audio: {
            class: Audio,
            config: {
              uploader: {
                uploadByFile: async (file) => ({
                  url: URL.createObjectURL(file),
                  fileName: file.name,
                }),
              },
            },
          },
          file: {
            class: FileBlock,
            config: {
              uploader: {
                uploadByFile: async (file) => ({
                  url: URL.createObjectURL(file),
                  fileName: file.name,
                  size: file.size,
                  mimeType: file.type,
                }),
              },
            },
          },
          column_list: ColumnList,
          column: Column,
          embed: Embed,
          bookmark: { class: Bookmark, config: { endpoint: '/unfurl' } },
          marker: Marker,
          bold: Bold,
          italic: Italic,
          underline: Underline,
          clearFormat: ClearFormat,
          link: Link,
          strikethrough: Strikethrough,
          inlineCode: InlineCode,
          equation: Equation,
          supSub: SupSub,
      };

      // Per-segment tool config overrides (e.g. `sources: 'url'`) merge on
      // top of the base config so defaults like the uploader are kept.
      Object.entries(toolConfig).forEach(([name, override]) => {
        const entry = tools[name];
        const base = typeof entry === 'function' ? { class: entry } : entry;
        tools[name] = { ...base, config: { ...(base.config ?? {}), ...override } };
      });

      const instance = new Blok({
        holder,
        data: { blocks },
        tools,
        minHeight: 0,
      });
      blockStatesInstances.push(instance);

      // The broken demo image 404s at once; keep Retry's loading state visible
      // and let half the retries succeed.
      if (blocks.some((block) => block.id === 'im-broken')) slowImageRetries(holder, {
        delayMs: 2000,
        recoverUrl: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800',
      });

      // Force persistent loading overlay on the "Loading" image state demo.
      // Clone the <img> to strip load/error listeners (so overlay can't clear),
      // then blank the src and set data-loading on the figure.
      instance.isReady.then(() => {
        const figure = holder.querySelector('[data-blok-id="im-loading"] .blok-image-inner');
        if (figure) {
          const img = figure.querySelector('img');
          if (img) {
            const clone = img.cloneNode(false);
            clone.removeAttribute('src');
            img.replaceWith(clone);
          }
          figure.setAttribute('data-loading', 'true');
        }

        const uploadErrBlock = holder.querySelector('[data-blok-id="im-upload-error"]');
        if (uploadErrBlock) failDemoUpload(uploadErrBlock);

        // Force a video "upload failed" error state demo by replacing the tool DOM.
        const videoErrRoot = holder.querySelector('[data-blok-id="vd-upload-error"] [data-blok-tool="video"]');
        if (videoErrRoot) {
          videoErrRoot.setAttribute('data-state', 'error');
          videoErrRoot.replaceChildren();
          const wrap = document.createElement('div');
          wrap.className = 'blok-video-error-state';
          wrap.setAttribute('data-role', 'video-error');
          const msg = document.createElement('span');
          msg.textContent = 'Upload failed';
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'blok-video-retry';
          retry.setAttribute('data-action', 'replace');
          retry.textContent = 'Replace';
          wrap.append(msg, retry);
          videoErrRoot.appendChild(wrap);
        }

        // Force the audio "Google Drive error" state demo — the message shown
        // when a Drive share link is pasted without an uploadByUrl backend.
        const audioDriveErrRoot = holder.querySelector('[data-blok-id="au-drive-error"] [data-blok-tool="audio"]');
        if (audioDriveErrRoot) {
          audioDriveErrRoot.setAttribute('data-state', 'error');
          audioDriveErrRoot.replaceChildren();
          const wrap = document.createElement('div');
          wrap.className = 'blok-audio-error-state';
          wrap.setAttribute('data-role', 'audio-error');
          const msg = document.createElement('span');
          msg.textContent = 'Google Drive links can’t be played directly — download the file and upload it here instead.';
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'blok-audio-retry';
          retry.setAttribute('data-action', 'replace');
          retry.textContent = 'Replace';
          wrap.append(msg, retry);
          audioDriveErrRoot.appendChild(wrap);
        }

        // Force the transient file-upload loading state. The uploader resolves
        // instantly here, so render the real uploading UI at a fixed progress.
        const fileUploadingRoot = holder.querySelector('[data-blok-id="fl-uploading"] [data-blok-tool="file"]');
        if (fileUploadingRoot) {
          fileUploadingRoot.replaceChildren();
          const uploadingEl = renderFileUploadingState({
            fileName: 'tracemonkey-paper.pdf',
            labels: { uploading: 'Uploading', cancel: 'Cancel', progress: 'Upload progress' },
            onCancel: () => {},
          });
          uploadingEl.setProgress(64);
          fileUploadingRoot.appendChild(uploadingEl);
        }
      });
    }

    // Picks a real picture in the block's empty state; the playground uploader rejects it.
    async function failDemoUpload(block) {
      const blob = await (await fetch('/samples/soundhelix-song-1-cover.png')).blob();
      const input = block.querySelector('[data-blok-testid="file-input"]');
      if (!input) return;
      const picked = new DataTransfer();
      picked.items.add(new File([blob], 'album-cover.png', { type: 'image/png' }));
      input.files = picked.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function initBlockStatesGallery(initialTool) {
      blockStatesHandle = renderBlockStatesGallery({
        container: document.getElementById('block-states-gallery'),
        spec: BLOCK_STATES_SPEC,
        renderBlock: mountStatePreview,
        activeTool: initialTool || undefined,
        onTabChange: (tool) => {
          history.pushState(null, '', `/block-states/${tool}`);
        },
      });
    }

    // Reveal page once editor is ready (Tailwind CSS is injected during Blok init, before either fires).
    // A slow load shows Blok's skeleton first; revealing only at isReady would fade the page in again after the skeleton handoff.
    const skeletonShown = new Promise((resolve) => {
      const observer = new MutationObserver(() => {
        if (document.querySelector('#blok [data-blok-loading-skeleton]')) {
          observer.disconnect();
          resolve();
        }
      });
      observer.observe(document.getElementById('blok'), { childList: true, subtree: true });
      blok.isReady.finally(() => observer.disconnect());
    });
    Promise.race([blok.isReady, skeletonShown]).then(() => document.body.classList.add('ready'));
  </script>
</body>
</html>
