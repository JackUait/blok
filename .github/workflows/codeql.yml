name: CodeQL

on:
  push:
    branches: ["main"]
    paths:
      - "packages/server/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/server/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C# server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          install-docs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build C# server
        run: dotnet build packages/server/dotnet/Blok.Server.slnx --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Analyze C# server
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
