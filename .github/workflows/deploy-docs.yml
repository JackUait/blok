name: Deploy Docs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to verify and deploy
        required: false
        type: string
      dry_run:
        description: Build and verify the site without deploying it
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Release runs get their own group: a main push cancelling one mid-snapshot
# leaves its assets missing, and every later build fails on them. Real
# releases arrive as a release_tag dispatch from release-server.yml, so the
# group keys on the tag, not on the event name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.release_tag || 'deploy' }}
  cancel-in-progress: true

jobs:
  docs-tests:
    name: Docs Unit Tests
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Run docs tests
        run: cd docs && npm test

  # Checks that the package family, NuGets, host assets, and image matching the
  # release tag are published, so docs never advertise missing delivery. This is
  # meaningless for a docs-only deploy, hence the tagged-release gate.
  verify-release:
    name: Verify Package Family Release
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_sha == github.sha)
      || github.event_name == 'release'
      || inputs.release_tag != ''
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify published package family
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          tag="${RELEASE_TAG:-v$(node -p "require('./package.json').version")}"
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/verify-docs-release.mjs "$tag"
          else
            node scripts/verify-docs-release.mjs "$tag" --packages-only
          fi

  # Builds this release's root and archive snapshots and attaches them to the
  # release, where `build` downloads them. Prereleases never become the root.
  # release-server.yml publishes with GITHUB_TOKEN, which starts no `release`
  # run, then dispatches every v* tag (betas too) with release_tag. A dispatch
  # has no prerelease flag, so the tag's `-` is what keeps betas out.
  snapshot:
    name: Snapshot Release Docs
    runs-on: ubuntu-latest
    needs: [docs-tests, verify-release]
    if: >-
      (github.event.release.tag_name || inputs.release_tag) != ''
      && !github.event.release.prerelease
      && !contains(github.event.release.tag_name || inputs.release_tag, '-')
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          # The root snapshot is the live site, and its sitemap dates each page
          # from `git log`. A shallow clone collapses every lastmod to one date.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      # No token here: build and dependency scripts would see the write token.
      - name: Build snapshots
        id: snapshots
        run: |
          yarn build
          minor="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")"
          node docs/scripts/build-snapshot.mjs --version "$minor" --base / --out docs-root.tgz
          # Audits the root build left in docs/dist: the next build-snapshot deletes it.
          node docs/scripts/audit-build-output.mjs --report docs-build-audit.json
          node docs/scripts/build-snapshot.mjs --version "$minor" --base "/v/$minor/" --out "docs-v$minor.tgz"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      - name: Upload build audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-build-audit
          path: docs-build-audit.json
          if-no-files-found: ignore

      - name: Attach snapshots to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          MINOR: ${{ steps.snapshots.outputs.minor }}
        run: |
          gh release upload "$TAG" docs-root.tgz "docs-v$MINOR.tgz" --clobber

  build:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: [docs-tests, verify-release, snapshot]
    timeout-minutes: 15
    outputs:
      marker: ${{ steps.marker.outputs.path }}
      build_sha: ${{ steps.build-info.outputs.sha }}
      manifest_hash: ${{ steps.build-info.outputs.manifest }}
    permissions:
      contents: read
      pages: read
    # Main deploys arrive only from a successful CI workflow_run. Tagged and
    # manual releases keep the package-family verification path below.
    if: >-
      ${{ !cancelled()
      && needs.docs-tests.result == 'success'
      && (needs.verify-release.result == 'success' || needs.verify-release.result == 'skipped')
      && (needs.snapshot.result == 'success' || needs.snapshot.result == 'skipped')
      && (github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_sha == github.sha)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}
          # generate-seo-artifacts.mjs dates every page from `git log -1` on its
          # sources. A shallow clone has no such history, so all 148 sitemap
          # lastmod values collapse to the deploy date. Note: the live sitemap
          # now comes from the root snapshot built by `snapshot` at release
          # time; this job's /next/ build writes no sitemap.
          fetch-depth: 0

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Build Blok library
        run: yarn build

      # Root = latest stable release snapshot, /v/<minor>/ = archived release
      # snapshots, both downloaded from release assets; /next/ = this commit.
      # The library is NOT copied into the artifact: the demo's `/dist/react.mjs`
      # and `/dist/tools.mjs` imports are resolved and bundled at build time by
      # docs/vite.config.ts's external-dist plugin, so the deployed site never
      # requests /dist from its own origin — the copy was 47 MB of dead weight.
      - name: Build next snapshot
        run: |
          node docs/scripts/build-snapshot.mjs --version next --base /next/ --out next.tgz

      - name: Assemble versioned site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node docs/scripts/assemble-site.mjs --next next.tgz --out site
          cp CHANGELOG.md site/CHANGELOG.md

      # Names the commit and a hash of every page in this artifact, at
      # /build-info.json and at /build-info/<hash>.json. The live check polls
      # the hash-named copy, which no CDN has cached. Must run last: a page
      # written into site/ after it would not be in the hash.
      - name: Record build info
        id: build-info
        run: node scripts/docs-build-info.mjs site

      # A prerender regression is invisible from a green build: the files are
      # still emitted, they are just empty shells again, and every crawler that
      # does not run JavaScript sees a blank page. Probe one real page for
      # rendered markup, and check the two files that make the site crawlable
      # at all — before anything is published, not after.
      - name: Verify deploy artifact
        run: |
          set -euo pipefail
          page=site/docs/quick-start/index.html
          test -f "$page"
          grep -q '<h1' "$page"
          grep -q 'Blok' "$page"
          test -s site/robots.txt
          test -s site/sitemap.xml
          test -s site/build-info.json
          test -s "site/build-info/$(node -p "require('./site/build-info.json').manifestHash").json"
          test -f site/next/docs/quick-start/index.html
          grep -q 'noindex' site/next/docs/quick-start/index.html
          test -s site/versions.json
          archive="$(node -p "require('./site/versions.json').versions.find(v => v.path.startsWith('/v/'))?.path ?? ''")"
          if [ -n "$archive" ]; then test -f "site${archive}index.html"; grep -q 'noindex' "site${archive}index.html"; fi
          # Not `! grep`: set -e ignores a negated command.
          if grep -q 'noindex' site/docs/quick-start/index.html; then
            echo "The root snapshot is noindex; the live site would drop out of search" >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Names one content-hashed file from this exact build. The smoke test polls
      # for it, because a 200 on `/` only proves the PREVIOUS deploy is alive.
      # Taken from /next/: the root is a release snapshot, unchanged on a plain
      # main push, so a root marker would match the previous deploy.
      - name: Record deploy marker
        id: marker
        run: |
          asset="$(find site/next/assets -name 'client-*.js' -print -quit)"
          # Empty would silently turn the smoke test's readiness poll into a
          # no-op, and it would then pass against the previous deploy.
          if [ -z "$asset" ]; then
            echo "No content-hashed client asset found; the build output shape changed" >&2
            exit 1
          fi
          echo "path=/${asset#site/}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # A skip propagates through the whole `needs` chain, not just one link:
    # `verify-release` is skipped on a docs push, `build` overrides that for
    # itself and goes green — and `deploy` is skipped anyway. Every docs deploy
    # between ungating the build and this line built the site, verified the
    # artifact, and published nothing.
    # `dry_run` builds and verifies the artifact without publishing it.
    if: ${{ !cancelled() && needs.build.result == 'success' && !inputs.dry_run }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Everything else in this repo verifies bytes on the runner. This verifies
  # what the host serves: status codes, redirects, a real 404, and whether the
  # sitemap's dates survived the checkout. Both of the worst SEO defects this
  # repo shipped were invisible until someone curled production.
  seo-smoke:
    name: Verify Live Docs
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && !inputs.dry_run }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify the live site
        env:
          DEPLOY_MARKER: ${{ needs.build.outputs.marker }}
          EXPECTED_BUILD_SHA: ${{ needs.build.outputs.build_sha }}
          EXPECTED_MANIFEST_HASH: ${{ needs.build.outputs.manifest_hash }}
        run: node scripts/verify-live-docs.mjs "https://blokeditor.com" --crawl --require-build-info --report live-docs-report.json

      - name: Upload live check report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-docs-report
          path: live-docs-report.json
          if-no-files-found: ignore
