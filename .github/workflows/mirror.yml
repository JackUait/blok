name: Push to mirror

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  mirror:
    if: >-
      (github.event_name == 'workflow_run'
      && github.repository != 'dodopizza/blok'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_sha == github.sha)
      || (github.event_name == 'push'
      && github.repository != 'dodopizza/blok'
      && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Require successful CI for a release tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed CI attempt is not the final answer: a re-run replaces the
          # conclusion on the same run, and this job is the only thing that ever
          # pushes the tag. Exiting on the first red strands the tag for good.
          last=""
          for _ in $(seq 1 360); do
            state="$(gh run list --workflow CI --branch main --event push --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion \
              --jq 'if length == 0 then "missing" else "\(.[0].status):\(.[0].conclusion // "")" end')"
            if [ "$state" = "completed:success" ]; then
              exit 0
            fi
            if [ "$state" != "$last" ]; then
              echo "::notice::CI is $state for $GITHUB_SHA; waiting for a green attempt"
              last="$state"
            fi
            sleep 10
          done
          echo "::error::CI did not pass for $GITHUB_SHA after 60 minutes"
          exit 1

      - name: Push to mirror
        run: |
          git remote add mirror https://x-access-token:${{ secrets.MIRROR_PAT }}@github.com/dodopizza/blok.git
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            git push mirror "+${{ github.event.workflow_run.head_sha }}:refs/heads/main"
          else
            git push mirror "refs/tags/$GITHUB_REF_NAME"
          fi
