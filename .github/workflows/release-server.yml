name: Release server

on:
  push:
    tags: ['v*']

concurrency:
  group: release-server
  cancel-in-progress: false

jobs:
  release-server:
    name: Release server
    if: github.repository == 'JackUait/blok'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          install-docs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "BLOK_SERVER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Wait for successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 360); do
            state="$(gh run list --workflow CI --branch main --event push --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion \
              --jq 'if length == 0 then "missing" else "\(.[0].status):\(.[0].conclusion // "")" end')"
            case "$state" in
              completed:success)
                exit 0
                ;;
              completed:*)
                echo "::error::CI did not pass for $GITHUB_SHA ($state)"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::CI did not complete for $GITHUB_SHA after 60 minutes"
          exit 1

      - name: Wait for the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::no draft GitHub release for $GITHUB_REF_NAME after 10 minutes"
          exit 1

      - name: Test and format C# server
        run: |
          dotnet test packages/server/dotnet/Blok.Server.slnx --configuration Release
          dotnet format packages/server/dotnet/Blok.Server.slnx --verify-no-changes
          yarn test test/unit/server-conformance/server-contract.test.ts

      - name: Build NuGet and host artifacts
        run: |
          rm -rf .server-release-dist
          mkdir -p .server-release-dist/nuget
          dotnet pack packages/server/dotnet/Blok.Server/Blok.Server.csproj \
            --configuration Release \
            -p:PackageVersion="$BLOK_SERVER_VERSION" \
            -p:ContinuousIntegrationBuild=true \
            --output .server-release-dist/nuget
          dotnet pack packages/server/dotnet/Blok.Server.AspNetCore/Blok.Server.AspNetCore.csproj \
            --configuration Release \
            -p:PackageVersion="$BLOK_SERVER_VERSION" \
            -p:ContinuousIntegrationBuild=true \
            --output .server-release-dist/nuget
          node scripts/test-server-packages.mjs --package-dir .server-release-dist/nuget --version "$BLOK_SERVER_VERSION"
          node scripts/publish-server.mjs --version "$BLOK_SERVER_VERSION" --output .server-release-dist

      - name: Smoke runner-native archive
        run: |
          mkdir -p .server-release-smoke
          tar -xzf .server-release-dist/blok-server_linux_amd64.tar.gz -C .server-release-smoke
          .server-release-smoke/blok-server --help

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push .server-release-dist/nuget/Blok.Server."$BLOK_SERVER_VERSION".nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push .server-release-dist/nuget/Blok.Server.AspNetCore."$BLOK_SERVER_VERSION".nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            .server-release-dist/blok-server_darwin_amd64.tar.gz \
            .server-release-dist/blok-server_darwin_arm64.tar.gz \
            .server-release-dist/blok-server_linux_amd64.tar.gz \
            .server-release-dist/blok-server_linux_arm64.tar.gz \
            .server-release-dist/blok-server_linux_musl_amd64.tar.gz \
            .server-release-dist/blok-server_linux_musl_arm64.tar.gz \
            .server-release-dist/blok-server_windows_amd64.zip \
            .server-release-dist/blok-server_windows_arm64.zip \
            .server-release-dist/checksums.txt \
            .server-release-dist/nuget/Blok.Server."$BLOK_SERVER_VERSION".nupkg \
            .server-release-dist/nuget/Blok.Server.AspNetCore."$BLOK_SERVER_VERSION".nupkg \
            --clobber

      - name: Build and smoke linux/amd64 image
        run: |
          image="ghcr.io/jackuait/blok-server"
          image_tags=(--tag "$image:$BLOK_SERVER_VERSION")
          if [[ "$BLOK_SERVER_VERSION" != *-* ]]; then
            image_tags+=(--tag "$image:latest")
          fi
          docker build --platform linux/amd64 -f packages/server/Dockerfile \
            --build-arg BLOK_SERVER_VERSION="$BLOK_SERVER_VERSION" \
            "${image_tags[@]}" \
            .

          unsafe_log="$(mktemp)"
          set +e
          timeout 10s docker run --rm "$image:$BLOK_SERVER_VERSION" \
            --listen 0.0.0.0:4000 --auth none >"$unsafe_log" 2>&1
          unsafe_status=$?
          set -e

          if [ "$unsafe_status" -eq 124 ]; then
            echo "::error::unsafe configuration smoke timed out"
            cat "$unsafe_log"
            exit 1
          fi
          if [ "$unsafe_status" -eq 0 ]; then
            echo "::error::public unauthenticated configuration started"
            exit 1
          fi
          unsafe_refusal="$(cat "$unsafe_log")"
          rm -f "$unsafe_log"
          expected_refusal='blok-server refused to start: --auth none serves anyone who can reach "0.0.0.0:4000" (which binds every network interface); it may only bind loopback — use --listen 127.0.0.1:PORT, or --auth ticket to expose this service'
          if [ "$unsafe_refusal" != "$expected_refusal" ]; then
            echo "::error::unsafe configuration failed for an unexpected reason"
            printf '%s\n' "$unsafe_refusal"
            exit 1
          fi

          docker run --detach --rm --name blok-server-release-smoke \
            --network host \
            "$image:$BLOK_SERVER_VERSION" \
            --listen 127.0.0.1:4000 \
            --auth proxy \
            --storage-dir ''
          trap 'docker rm -f blok-server-release-smoke >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          test "$(curl --fail --silent http://127.0.0.1:4000/health)" = \
            "{\"status\":\"ok\",\"version\":\"$BLOK_SERVER_VERSION\"}"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:4000/unfurl)" = "400"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:4000/upload)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:4000/missing)" = "404"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-architecture image
        run: |
          image="ghcr.io/jackuait/blok-server"
          image_tags=(--tag "$image:$BLOK_SERVER_VERSION")
          if [[ "$BLOK_SERVER_VERSION" != *-* ]]; then
            image_tags+=(--tag "$image:latest")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f packages/server/Dockerfile \
            --build-arg BLOK_SERVER_VERSION="$BLOK_SERVER_VERSION" \
            "${image_tags[@]}" \
            --push \
            .

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

      - name: Verify published server delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_path="${BLOK_SERVER_VERSION,,}"
          required_assets=(
            blok-server_darwin_amd64.tar.gz
            blok-server_darwin_arm64.tar.gz
            blok-server_linux_amd64.tar.gz
            blok-server_linux_arm64.tar.gz
            blok-server_linux_musl_amd64.tar.gz
            blok-server_linux_musl_arm64.tar.gz
            blok-server_windows_amd64.zip
            blok-server_windows_arm64.zip
            checksums.txt
            "Blok.Server.$BLOK_SERVER_VERSION.nupkg"
            "Blok.Server.AspNetCore.$BLOK_SERVER_VERSION.nupkg"
          )
          anonymous_docker_config="$(mktemp -d)"

          for _ in $(seq 1 60); do
            ready=true
            for package in blok.server blok.server.aspnetcore; do
              curl --fail --silent \
                "https://api.nuget.org/v3-flatcontainer/$package/$version_path/$package.$version_path.nupkg" \
                >/dev/null || ready=false
            done

            assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')" || ready=false
            for asset in "${required_assets[@]}"; do
              grep --fixed-strings --line-regexp --quiet "$asset" <<<"$assets" || ready=false
            done

            manifest=''
            if ! manifest="$(DOCKER_CONFIG="$anonymous_docker_config" docker manifest inspect \
              "ghcr.io/jackuait/blok-server:$BLOK_SERVER_VERSION" 2>/dev/null)"; then
              ready=false
            fi
            grep --quiet '"architecture": "amd64"' <<<"$manifest" || ready=false
            grep --quiet '"architecture": "arm64"' <<<"$manifest" || ready=false

            if [ "$ready" = "true" ]; then
              exit 0
            fi
            sleep 10
          done

          echo "::error::server delivery is not fully observable after 10 minutes"
          exit 1

      - name: Publish the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Deploy docs from the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-docs.yml \
            --ref "$GITHUB_REF_NAME" \
            -f release_tag="$GITHUB_REF_NAME"
