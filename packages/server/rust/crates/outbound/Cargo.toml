[package]
name = "blok-outbound"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blok-dotnet = { path = "../dotnet" }
blok-jsjson = { path = "../jsjson" }
blok-mediatype = { path = "../mediatype" }
brotli = "8"
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "sync", "macros"] }

[lints]
workspace = true
