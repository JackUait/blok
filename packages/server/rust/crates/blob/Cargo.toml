[package]
name = "blok-blob"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blok-collab-workingset = { path = "../collab-workingset" }
blok-dotnet = { path = "../dotnet" }
blok-mediatype = { path = "../mediatype" }
blok-outbound = { path = "../outbound" }
getrandom = "0.4"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "rt-multi-thread", "time", "sync", "macros"] }

[lints]
workspace = true
