[package]
name = "blok-blokagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal part of blok-mcp (agent command engine). Not a stable API."
publish = true

[dependencies]
blok-blokdocs.workspace = true
blok-collab-convert.workspace = true
blok-collab-docendpoint.workspace = true
blok-collab-room.workspace = true
blok-dotnet.workspace = true
blok-jsjson.workspace = true
blok-jsruntime.workspace = true
blok-yjs.workspace = true
getrandom = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "sync"] }

[dev-dependencies]
blok-collab = { path = "../collab" }
blok-collab-journal = { path = "../collab-journal" }
blok-collab-workingset = { path = "../collab-workingset" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
