[package]
name = "blok-blokserver"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The conformance build: blokserver's conformance.go.
conformance = []

[dependencies]
blok-auth = { path = "../auth" }
blok-blob = { path = "../blob" }
blok-blokdocs = { path = "../blokdocs" }
blok-collab = { path = "../collab" }
blok-collab-collabhttp = { path = "../collab-collabhttp" }
blok-collab-convert = { path = "../collab-convert" }
blok-collab-docendpoint = { path = "../collab-docendpoint" }
blok-collab-journal = { path = "../collab-journal" }
blok-collab-room = { path = "../collab-room" }
blok-collab-synchttp = { path = "../collab-synchttp" }
blok-collab-workingset = { path = "../collab-workingset" }
blok-dotnet = { path = "../dotnet" }
blok-framecheck = { path = "../framecheck" }
blok-http = { path = "../http" }
blok-jsjson = { path = "../jsjson" }
blok-jsruntime = { path = "../jsruntime" }
blok-mediatype = { path = "../mediatype" }
blok-outbound = { path = "../outbound" }
blok-route = { path = "../route" }
blok-ticket = { path = "../ticket" }
blok-unfurl = { path = "../unfurl" }
getrandom = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }

[dev-dependencies]
blok-collab-operation = { path = "../collab-operation" }
blok-blokserver-ticket = { path = "../blokserver-ticket" }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
