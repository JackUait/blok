[package]
name = "blok-blokserver"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The conformance build: blokserver's conformance.go.
conformance = []

[dependencies]
blok-auth = { path = "../auth" }
blok-blob = { path = "../blob" }
blok-blokdocs = { path = "../blokdocs" }
blok-dotnet = { path = "../dotnet" }
blok-http = { path = "../http" }
blok-jsjson = { path = "../jsjson" }
blok-jsruntime = { path = "../jsruntime" }
blok-mediatype = { path = "../mediatype" }
blok-route = { path = "../route" }
blok-ticket = { path = "../ticket" }
getrandom = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }

[dev-dependencies]
blok-blokserver-ticket = { path = "../blokserver-ticket" }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
