repository.workspace = true
description = "Internal part of blok-mcp (embedded JavaScript runtime). Not a stable API."
publish = true

[dependencies]
icu_collator = "2.4.0"
rquickjs = "=0.14.0"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
sha2 = "0.10"
