name: CodeQL

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blok.Server.csproj builds the JS document runtime with vite before it
      # compiles, so the C# leg needs the workspace installed like ci.yml's
      # Server job does. Without it every dotnet build here dies on ERR_MODULE_NOT_FOUND.
      - name: Setup Node.js and Dependencies
        if: matrix.language == 'csharp'
        uses: ./.github/actions/setup-node-deps
        with:
          install-docs: "false"

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build C# server
        if: matrix.language == 'csharp'
        run: dotnet build packages/server/dotnet/Blok.Server.slnx --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Analyze source
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          output: codeql-results

      - name: Enforce high-severity CodeQL results
        run: node scripts/check-codeql-results.mjs "${{ steps.analyze.outputs.sarif-output }}"
