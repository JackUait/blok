[package]
name = "blok-collab-room"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blok-collab = { path = "../collab" }
blok-collab-convert = { path = "../collab-convert" }
blok-collab-docendpoint = { path = "../collab-docendpoint" }
blok-collab-journal = { path = "../collab-journal" }
blok-collab-operation = { path = "../collab-operation" }
blok-collab-wire = { path = "../collab-wire" }
blok-collab-workingset = { path = "../collab-workingset" }
blok-dotnet = { path = "../dotnet" }
blok-jsjson = { path = "../jsjson" }
blok-jsruntime = { path = "../jsruntime" }
blok-yjs = { path = "../yjs" }
getrandom = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
base64 = "0.22"
blok-collab-collabtest = { path = "../collab-collabtest" }
blok-lib0 = { path = "../lib0" }
blok-yjs-yjstest = { path = "../yjs-yjstest" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
