name: Deploy Docs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to verify and deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  docs-tests:
    name: Docs Unit Tests
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Run docs tests
        run: cd docs && npm test

  # Checks that the package family, NuGets, host assets, and image matching the
  # release tag are published, so docs never advertise missing delivery. This is
  # meaningless for a docs-only deploy, hence the tagged-release gate.
  verify-release:
    name: Verify Package Family Release
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_sha == github.sha)
      || github.event_name == 'release'
      || inputs.release_tag != ''
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify published package family
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          tag="${RELEASE_TAG:-v$(node -p "require('./package.json').version")}"
          node scripts/verify-docs-release.mjs "$tag"

  build:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: [docs-tests, verify-release]
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    # Main deploys arrive only from a successful CI workflow_run. Tagged and
    # manual releases keep the package-family verification path below.
    if: >-
      ${{ !cancelled()
      && needs.docs-tests.result == 'success'
      && (needs.verify-release.result == 'success' || needs.verify-release.result == 'skipped')
      && (github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_sha == github.sha)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Build Blok library
        run: yarn build

      - name: Build docs
        run: cd docs && yarn build

      # The library is NOT copied into the artifact: the demo's `/dist/react.mjs`
      # and `/dist/tools.mjs` imports are resolved and bundled at build time by
      # docs/vite.config.ts's external-dist plugin, so the deployed site never
      # requests /dist from its own origin — the copy was 47 MB of dead weight.
      - name: Copy CHANGELOG into docs output
        run: cp CHANGELOG.md docs/dist/CHANGELOG.md

      # A prerender regression is invisible from a green build: the files are
      # still emitted, they are just empty shells again, and every crawler that
      # does not run JavaScript sees a blank page. Probe one real page for
      # rendered markup, and check the two files that make the site crawlable
      # at all — before anything is published, not after.
      - name: Verify deploy artifact
        run: |
          set -euo pipefail
          page=docs/dist/client/docs/quick-start/index.html
          test -f "$page"
          grep -q '<h1' "$page"
          grep -q 'Blok' "$page"
          test -s docs/dist/client/robots.txt
          test -s docs/dist/client/sitemap.xml

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # React Router's framework build splits its output into dist/client (the
      # prerendered HTML + assets) and dist/server; only the client half is the
      # site, so the artifact root moved one level down.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/dist/client/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # A skip propagates through the whole `needs` chain, not just one link:
    # `verify-release` is skipped on a docs push, `build` overrides that for
    # itself and goes green — and `deploy` is skipped anyway. Every docs deploy
    # between ungating the build and this line built the site, verified the
    # artifact, and published nothing.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
