name: Push to mirror

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  # write, because the gate re-runs a red CI attempt itself.
  actions: write
  contents: read

jobs:
  mirror:
    if: >-
      (github.event_name == 'workflow_run'
      && github.repository != 'dodopizza/blok'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_sha == github.sha)
      || (github.event_name == 'push'
      && github.repository != 'dodopizza/blok'
      && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Require successful CI for a release tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed CI attempt is not the final answer: a re-run replaces the
          # conclusion on the same run, and this job is the only thing that ever
          # pushes the tag. Exiting on the first red strands the tag for good.
          # So the gate re-runs the red attempt itself. Waiting for a person to
          # do it burns the whole hour, and CI on a release commit goes red from
          # a flaky e2e shard often enough for that to be the normal case.
          RERUN_BUDGET=2

          # `|| echo` because the shell is `bash -e`: one transient 404 from the
          # API would otherwise kill the gate, and with it the tag.
          poll() {
            gh run list --workflow CI --branch main --event push --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion,databaseId \
              --jq 'if length == 0 then "missing:none:0" else "\(.[0].status):\(.[0].conclusion // "none"):\(.[0].databaseId)" end' \
              || echo "poll-failed:none:0"
          }

          last=""
          reruns=0

          for _ in $(seq 1 360); do
            answer="$(poll)"
            state="${answer%:*}"
            run_id="${answer##*:}"

            if [ "$state" = "completed:success" ]; then
              exit 0
            fi

            if [ "$state" != "$last" ]; then
              echo "::notice::CI is $state for $GITHUB_SHA; waiting for a green attempt"
              last="$state"
            fi

            case "$state" in
              completed:*)
                if [ "$reruns" -ge "$RERUN_BUDGET" ]; then
                  echo "::error::CI is $state for $GITHUB_SHA after $reruns re-runs"
                  exit 1
                fi

                reruns=$(( reruns + 1 ))
                echo "::notice::re-running the failed jobs of run $run_id ($reruns of $RERUN_BUDGET)"
                gh run rerun "$run_id" --failed || true
                last=""

                # The run still reads `completed` for a few seconds after the
                # request. Judging it again that early would spend the whole
                # budget on the attempt that is already restarting.
                for _ in $(seq 1 30); do
                  sleep 10
                  case "$(poll)" in
                    completed:*) ;;
                    *) break ;;
                  esac
                done
                ;;
            esac

            sleep 10
          done
          echo "::error::CI did not pass for $GITHUB_SHA after 60 minutes"
          exit 1

      - name: Push to mirror
        run: |
          git remote add mirror https://x-access-token:${{ secrets.MIRROR_PAT }}@github.com/dodopizza/blok.git
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            git push mirror "+${{ github.event.workflow_run.head_sha }}:refs/heads/main"
          else
            git push mirror "refs/tags/$GITHUB_REF_NAME"
          fi
