name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  i18n:
    name: i18n Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Check translations
        run: node scripts/i18n/check-translations.mjs

      - name: Check docs translations
        run: node scripts/i18n/check-docs-translations.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Restore lint cache
        id: lint-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/.cache/blok-eslint
            node_modules/.cache/blok-lint.tsbuildinfo
          # v2: v1 caches are poisoned — ESLint's cache persists per-file results
          # INCLUDING errors, keyed only on that file's own content, so an error
          # computed against broken types replays on every later run even after
          # the types are fixed. Bump the version to abandon them.
          key: lint-v2-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            lint-v2-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs', 'tsconfig.json') }}-

      - name: Lint
        run: yarn lint

      # Save only after a green lint: a failed run's ESLint cache carries the
      # error entries, and restoring one replays those stale errors for every
      # file whose content didn't change since the failure.
      - name: Save lint cache
        if: success() && steps.lint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/blok-eslint
            node_modules/.cache/blok-lint.tsbuildinfo
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.7
          fail-on-error: true

  frontend-coverage:
    name: Frontend Coverage
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Download frontend coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frontend-coverage-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge frontend coverage
        run: yarn vitest --merge-reports=.vitest-reports --coverage --reporter=default

      - name: Upload coverage diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 3

  docs-quality:
    name: Docs Quality
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      - name: Check docs types
        run: yarn --cwd docs lint

      - name: Run docs coverage
        run: yarn --cwd docs test:coverage

      - name: Build docs
        run: yarn --cwd docs build

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build C# server
        if: matrix.language == 'csharp'
        run: dotnet build packages/server/dotnet/Blok.Server.slnx --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Analyze source
        id: analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          output: codeql-results

      - name: Enforce high-severity CodeQL results
        run: node scripts/check-codeql-results.mjs "${{ steps.analyze.outputs.sarif-output }}"

  server-security:
    name: Server Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Audit NuGet dependencies
        run: dotnet restore packages/server/dotnet/Blok.Server.slnx

      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

      - name: Scan repository vulnerabilities and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          format: table
          exit-code: '1'

      - name: Build server container image
        run: docker build --tag blok-server:ci --file packages/server/Dockerfile .

      - name: Scan server container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: blok-server:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          format: table
          exit-code: '1'

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Test .NET server with coverage
        run: |
          rm -rf .server-test-results .server-coverage
          dotnet test packages/server/dotnet/Blok.Server.slnx \
            --configuration Release \
            --collect:"Code Coverage;Format=Cobertura" \
            --results-directory .server-test-results

      - name: Enforce .NET server coverage
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            '-reports:.server-test-results/**/*.cobertura.xml' \
            '-targetdir:.server-coverage' \
            '-reporttypes:Cobertura;MarkdownSummaryGithub' \
            '-assemblyfilters:+Blok.Server*;-*.Tests'
          node scripts/check-server-coverage.mjs .server-coverage/Cobertura.xml
          cat .server-coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check .NET formatting
        run: dotnet format packages/server/dotnet/Blok.Server.slnx --verify-no-changes

      - name: Test packed .NET packages
        run: node scripts/test-server-packages.mjs

      - name: Test C# conformance
        run: node scripts/test-server-conformance.mjs --target csharp

      - name: Dry-run server artifacts
        run: node scripts/publish-server.mjs --version 1.10.1 --dry-run

      - name: Test server delivery wiring
        run: |
          yarn vitest run --project=unit \
            test/unit/server/bin.test.ts \
            test/unit/scripts/check-server-coverage.test.ts \
            test/unit/scripts/publish-server.test.ts \
            test/unit/scripts/verify-docs-release.test.ts \
            test/unit/scripts/release-cli.test.ts \
            test/unit/architecture/server-release-wiring.test.ts \
            test/unit/architecture/server-quality-gates.test.ts \
            test/unit/architecture/ci-critical-path-law.test.ts \
            test/unit/architecture/package-metadata-law.test.ts

  unit-tests:
    name: Unit Tests (${{ matrix.shard }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          # Archive keeps repo-relative paths (dist/, packages/*/dist/); extract at root.
          path: .

      - name: Build CLI
        run: yarn build:cli

      - name: Run Unit Tests with coverage
        run: |
          yarn vitest run --coverage --project=unit \
            --shard=${{ matrix.shard }} \
            --reporter=default \
            --reporter=blob \
            --coverage.reporter=json \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.lines=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0

      - name: Upload frontend coverage shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage-${{ strategy.job-index }}
          path: .vitest-reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  workspace-unit-tests:
    name: Workspace Unit Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      - name: Build CLI
        run: yarn build:cli

      # Keep non-root suites parallel so coverage shards do not wait on them.
      - name: Run Angular Unit Tests
        run: yarn test:angular

      - name: Run @bloklabs/react Unit Tests
        run: yarn workspace @bloklabs/react test

      - name: Run @bloklabs/presets Unit Tests
        run: yarn workspace @bloklabs/presets test

      - name: Run @bloklabs/server Unit Tests
        run: yarn workspace @bloklabs/server test

  validate-spec-coverage:
    name: Validate Spec File Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Validate all spec files match a Playwright project
        env:
          BLOK_VISUAL: '1'
        run: yarn validate:spec-coverage

      - name: Validate test categories
        run: yarn e2e:validate-categories

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Build
        run: yarn build

      - name: Build E2E fixtures
        run: |
          node scripts/build-react-vendor.mjs
          node scripts/build-vue-vendor.mjs
          node scripts/build-angular-vendor.mjs
          node scripts/override/sync.mjs

      # The adapters were extracted into packages/*/dist (they used to live under
      # dist/). Downstream jobs (Unit's bundle-outputs test, E2E's react-adapter
      # fixture) load those built adapter bundles, so they must travel in the
      # artifact too. The common ancestor of these paths is the repo root, so the
      # archive keeps each path at its repo-relative location — download steps
      # therefore extract at the repo root (path: .), not into dist/.
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/
            packages/react/dist/
            packages/vue/dist/
            packages/angular/dist/
            test/playwright/fixtures/vendor/
            override-extension/payload/
          retention-days: 1

  install-browsers:
    name: Install Browsers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Setup Playwright Browsers
        uses: ./.github/actions/setup-playwright-browsers
        with:
          browsers: chromium firefox webkit

  e2e-tests:
    name: E2E Tests
    needs: [build, install-browsers]
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
            shard: 1/2
          - project: chromium
            browser: chromium
            shard: 2/2
          - project: firefox
            browser: firefox
            shard: 1/2
          - project: firefox
            browser: firefox
            shard: 2/2
          - project: webkit
            browser: webkit
            shard: 1/3
          - project: webkit
            browser: webkit
            shard: 2/3
          - project: webkit
            browser: webkit
            shard: 3/3
          - project: chromium-logic
            browser: chromium
            shard: 1/2
          - project: chromium-logic
            browser: chromium
            shard: 2/2
          - project: chromium-default
            browser: chromium
            shard: 1/3
          - project: chromium-default
            browser: chromium
            shard: 2/3
          - project: chromium-default
            browser: chromium
            shard: 3/3
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: dist
      project: ${{ matrix.project }}
      browser: ${{ matrix.browser }}
      shard: ${{ matrix.shard }}
      artifact-index: ${{ strategy.job-index }}

  merge-reports:
    name: Merge E2E Reports
    if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Download all blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into unified HTML report
        run: |
          if [ -d ./all-blob-reports ] && [ -n "$(ls -A ./all-blob-reports 2>/dev/null)" ]; then
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "No blob reports found (e2e tests were skipped or cancelled); nothing to merge."
          fi

      - name: Upload unified HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  storybook-tests:
    name: Storybook Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      # Storybook tests only run in chromium (see vitest.config.ts). Installing all
      # browsers triggered ~2h CDN-throttled downloads that never finished.
      - name: Setup Playwright Browsers
        uses: ./.github/actions/setup-playwright-browsers
        with:
          browsers: chromium
          cache-key-prefix: playwright-storybook

      - name: Run Storybook Tests
        run: yarn storybook:test

  visual-regression:
    name: Visual Regression
    needs: [build]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run visual regression tests
        run: BLOK_BUILT=true BLOK_VISUAL=1 yarn playwright test --project=chromium-default test/playwright/tests/visual-regression

      - name: Upload visual regression diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  production-readiness:
    name: Production Readiness
    if: always()
    needs:
      - i18n
      - lint
      - workflow-lint
      - codeql
      - server-security
      - server
      - unit-tests
      - workspace-unit-tests
      - validate-spec-coverage
      - build
      - install-browsers
      - e2e-tests
      - storybook-tests
      - frontend-coverage
      - docs-quality
      - visual-regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every quality gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs).filter(([, value]) => value.result !== 'success');
          if (failed.length > 0) {
            console.error('Production readiness failed:', failed);
            process.exit(1);
          }
          console.log('Production readiness passed for every required job.');
          NODE
